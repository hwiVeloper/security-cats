<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>napi 소개</title>
<style>
  html, body { margin: 0; padding: 0; }
  .player { position: relative; line-height: 0; }
  video { display: block; width: 100%; height: auto; }
  .sound { position: absolute; right: 16px; bottom: 64px; border: 0; cursor: pointer; line-height: 1.2;
    padding: 10px 18px; border-radius: 999px; background: #f29a3f; color: #fff;
    font: 700 15px "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .sound[hidden] { display: none; }
</style>
</head>
<body>
<div class="player">
  <video id="v" autoplay muted loop playsinline controls preload="auto">
    <source src="data:video/mp4;base64,__VIDEO_BASE64__" type="video/mp4">
  </video>
  <button type="button" class="sound" id="sound">🔊 소리 켜기</button>
</div>
<script>
  // 브라우저는 소리 있는 자동재생을 막아서, 무음으로 자동재생하고 버튼으로 소리를 켠다.
  var v = document.getElementById("v");
  var b = document.getElementById("sound");
  function syncButton() { b.hidden = !v.muted; }
  b.addEventListener("click", function () {
    v.muted = false;
    v.currentTime = 0;
    v.play();
    syncButton();
  });
  v.addEventListener("volumechange", syncButton);
  var p = v.play();
  if (p && p.catch) p.catch(function () {});
</script>
</body>
</html>
