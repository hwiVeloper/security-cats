<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>napi 소개</title>
<style>
  :root { --bg:#fbf7f2; --ink:#3a2a20; --muted:#8a7a6e; --accent:#f29a3f; --line:#efe5da; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 32px; }
  h1 { font-size: 26px; margin: 0 0 16px; }
  .player { position: relative; border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: 0 20px 50px rgba(90,61,43,.18); aspect-ratio: 16 / 9; }
  video { display: block; width: 100%; height: 100%; }
  .sound { position: absolute; right: 16px; bottom: 64px; border: 0; cursor: pointer;
    padding: 10px 18px; border-radius: 999px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 700; font-size: 15px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .sound[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>napi 소개</h1>
  <div class="player">
    <video id="v" autoplay muted loop playsinline controls preload="auto">
      <source src="data:video/mp4;base64,__VIDEO_BASE64__" type="video/mp4">
    </video>
    <button type="button" class="sound" id="sound">🔊 소리 켜기</button>
  </div>
</div>
<script>
  // 브라우저는 소리 있는 자동재생을 막아서, 무음으로 자동재생하고 버튼으로 소리를 켠다.
  var v = document.getElementById("v");
  var b = document.getElementById("sound");
  function syncButton() { b.hidden = !v.muted; }
  b.addEventListener("click", function () {
    v.muted = false;
    v.currentTime = 0;
    v.play();
    syncButton();
  });
  v.addEventListener("volumechange", syncButton);
  var p = v.play();
  if (p && p.catch) p.catch(function () {});
</script>
</body>
</html>
